name: 'dbt_cloud_practice'
version: '1.0.0'

# Ignored in dbt Cloud -- the connection configured in the UI wins.
profile: 'default'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Each layer writes to its own schema. dbt prefixes these with the environment's
# schema, so the same code produces DEV_bronze / TEST_bronze / PROD_bronze etc.
models:
  dbt_cloud_practice:
    bronze:
      +materialized: view
      +schema: bronze
    silver:
      +materialized: view
      +schema: silver
    gold:
      +materialized: table
      +schema: gold
