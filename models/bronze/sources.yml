version: 2

# Raw is shared by every environment. dev, test and prod all read these same
# AIRBNB.RAW tables -- only what we build downstream is environment-specific.
sources:
  - name: airbnb
    database: AIRBNB
    schema: RAW
    tables:
      - name: listings
        identifier: raw_listings
        description: "Raw listings feed (~17,499 rows)."
      - name: hosts
        identifier: raw_hosts
        description: "Raw hosts feed (~14,111 rows)."
      - name: reviews
        identifier: raw_reviews
        description: "Raw reviews feed (~410,284 rows)."
