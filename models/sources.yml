version: 2

# The raw layer never moves between environments -- dev, test and prod all read
# the same AIRBNB.RAW tables. Only the models you *write* land in different schemas.
sources:
  - name: airbnb
    database: AIRBNB
    schema: RAW
    tables:
      - name: listings
        identifier: raw_listings
        description: "Raw Airbnb listings as loaded into Snowflake (~17,499 rows)."

      - name: hosts
        identifier: raw_hosts
        description: "Raw Airbnb hosts (~14,111 rows)."

      - name: reviews
        identifier: raw_reviews
        description: "Raw Airbnb reviews (~410,284 rows)."
